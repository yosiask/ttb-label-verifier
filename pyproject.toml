[project]
name = "ttb-label-verifier"
version = "0.1.0"
description = "Checks alcohol beverage label images against application data (TTB take-home)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "openai>=1.55",
    "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: runs real Tesseract on rendered fixtures (slower)"]

[tool.setuptools.package-data]
app = ["web/*", "web/examples/*"]
